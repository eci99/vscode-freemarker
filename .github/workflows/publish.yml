# Publishes the extension to the VS Code Marketplace and Open VSX when a version tag
# such as 0.1.15 is pushed. Both registries accept a short-lived OIDC token from this
# workflow (trusted publishing), so no access token is stored in the repository.
name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check that the tag matches the version in package.json
        if: github.ref_type == 'tag'
        run: test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm test

      - name: Package
        run: |
          npx --yes @vscode/vsce package --out extension.vsix
          npx --yes @vscode/vsce ls

      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --oidc --packagePath extension.vsix

      - name: Publish to Open VSX
        run: npx --yes ovsx publish extension.vsix --trusted-publishing
